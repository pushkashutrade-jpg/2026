<style>
:root{--bg:#050506;--card:#141416;--card2:#1f1f22;--tx:#fff;--mut:#8a8a8e;--dim:#3a3a3e;--on:#e4e4e7;--ontx:#000;--btn:#fff;--btntx:#000;--blue:#1f6bff;--green:#34d399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--card:#fff;--card2:#efeff4;--tx:#000;--mut:#6b6b70;--dim:#c7c7cc;--on:#1c1c1e;--ontx:#fff;--btn:#000;--btntx:#fff;--green:#059669;color-scheme:light}}
:root[data-theme="dark"]{--bg:#050506;--card:#141416;--card2:#1f1f22;--tx:#fff;--mut:#8a8a8e;--dim:#3a3a3e;--on:#e4e4e7;--ontx:#000;--btn:#fff;--btntx:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh;padding:12px 12px calc(110px + env(safe-area-inset-bottom,0px))}
.app{width:100%;max-width:430px;display:flex;flex-direction:column;gap:12px}
.app.fade>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
.app.fade>*:nth-child(2){animation-delay:.04s}.app.fade>*:nth-child(3){animation-delay:.08s}.app.fade>*:nth-child(4){animation-delay:.12s}.app.fade>*:nth-child(5){animation-delay:.16s}.app.fade>*:nth-child(6){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
svg{display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,background .2s,opacity .2s}
button:active{transform:scale(.97)}
.card{background:var(--card);border-radius:30px;padding:22px;position:relative;overflow:hidden}
.lbl{font-size:15px;color:var(--mut);font-weight:500}
.hd{padding:6px 8px 0}.hd .h1{font-size:30px;font-weight:800;letter-spacing:-.02em}.hd .h2{font-size:14px;color:var(--mut);margin-top:4px}
.big{display:inline-block;margin:12px 0 8px;border:2px dashed var(--mut);border-radius:24px;padding:10px 22px;font-size:38px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--dim);line-height:1.35;font-weight:500}
.msg{font-size:14px;color:var(--mut);line-height:1.45;margin-top:14px}
.msg.warn{color:#fb923c}.msg.ok{color:var(--green)}
.chips{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--card2);color:var(--mut);padding:11px 16px;border-radius:999px;font-size:15px;font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:66px;border-radius:999px;background:var(--btn);color:var(--btntx);font-size:18px;font-weight:700}
.cta .pl{width:34px;height:34px;border-radius:10px;background:var(--btntx);color:var(--btn);display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:28px;padding:16px 12px 18px;text-align:center;position:relative;color:var(--mut)}
.tile .bd{position:absolute;right:12px;top:14px;font-size:11px;font-weight:700;color:var(--green)}
.tile .ico{display:flex;justify-content:center;margin-bottom:12px;height:24px}
.tile .n{font-size:30px;font-weight:800;color:var(--tx);letter-spacing:-.03em}
.tile .t{font-size:13px;margin-top:8px;font-weight:500}
.hist .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:15px;font-weight:500;margin-bottom:16px}
.hist .top button{display:flex;align-items:center;gap:6px;color:var(--mut)}
.g30{display:grid;grid-template-columns:repeat(10,1fr);gap:8px 7px}
.p{height:26px;border-radius:999px;border:2px solid var(--card2);background:var(--card2)}
.p.f{background:var(--on);border-color:var(--on)}
.p.d{background:transparent;border:2px dashed var(--mut)}
.p.t{border:3px solid var(--blue);background:transparent}
.p.t.f{background:var(--on)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .card{padding:18px;border-radius:28px}
.mh{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:16px;font-weight:600}
.ms{font-size:12px;color:var(--dim);margin:2px 0 14px 26px}
.val{font-size:30px;font-weight:800;letter-spacing:-.03em}.val small{font-size:13px;color:var(--mut);font-weight:500;margin-left:4px;letter-spacing:0}
.wk{display:flex;justify-content:space-between;align-items:flex-end;height:96px;margin-top:10px}
.wk div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;gap:4px;font-size:10px;color:var(--mut);font-weight:600}
.wk i{display:block;width:22px;border-radius:7px;background:var(--dim);transition:height .5s}
.wk i.on{background:var(--on)}
.wk span{color:var(--dim)}
.bw{display:flex;align-items:center;justify-content:space-between}
.bw .sm{font-size:13px;color:var(--mut);margin-top:6px}
.step{display:flex;gap:8px}
.step button{width:42px;height:42px;border-radius:14px;background:var(--card2);font-size:22px;color:var(--tx)}
.bar{height:6px;background:var(--card2);border-radius:99px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--on);border-radius:99px;transition:width .5s}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav button{width:42px;height:42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.nav b{font-size:17px}
.dn,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dn{margin-bottom:8px;text-align:center;font-size:11px;color:var(--mut);font-weight:600}
.cc{height:46px;border-radius:15px;background:var(--card2);color:var(--tx);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.cc.f{background:var(--on);color:var(--ontx)}.cc.d{background:transparent;border:2px dashed var(--mut)}.cc.t{box-shadow:inset 0 0 0 3px var(--blue)}.cc.x{opacity:.45}.cc.e{background:transparent;pointer-events:none}
.fi{display:flex;gap:8px;align-items:center}
.fi input{width:96px;background:var(--card2);color:var(--tx);border:0;border-radius:14px;padding:11px 8px;font:inherit;font-size:17px;font-weight:700;text-align:center}
.fi span{font-size:14px;color:var(--mut)}
.rst{width:100%;height:56px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:16px;font-weight:600}
.rst.arm{background:#ea580c;color:#fff}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(20,20,22,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--dim);border-radius:999px;display:flex;padding:7px;gap:6px;z-index:20}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tabs{background:rgba(255,255,255,.9)}}
.tabs button{width:76px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.tabs button.on{background:var(--card2);color:var(--tx)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;animation:fi .25s both}
.sh{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--card);border-radius:32px 32px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:50;max-height:88vh;overflow-y:auto}
.sh.in{animation:sl .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}@keyframes fi{from{opacity:0}to{opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--dim);margin:0 auto 16px}
.sh h3{font-size:24px;font-weight:800;letter-spacing:-.02em}.sh .s2{font-size:14px;color:var(--mut);margin:4px 0 16px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 16px;background:var(--card2);border-radius:20px;margin-bottom:8px;text-align:left;font-size:16px;font-weight:600}
.task .bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;color:var(--ontx);flex:none}
.task.on .bx{background:var(--on);border-color:var(--on);animation:pop .3s}
.task.on .n{color:var(--mut);text-decoration:line-through}
.task.lock{opacity:.45;pointer-events:none}
@keyframes pop{50%{transform:scale(1.25)}}
.sh .sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 10px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--btn);color:var(--btntx);font-size:15px;font-weight:700;padding:13px 20px;border-radius:999px;z-index:60;transition:transform .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<div class="tabs" id="tabs"></div>
<div class="toast" id="toast"></div>
<script>
var I={flame:'<path d="M12 2c1 3.5 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2 1-3.5 2.2-4.6 0 2 .9 3.2 2 3.4C10 8.5 10.2 5 12 2z"/>',clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',layers:'<polygon points="12 3 3 7.5 12 12 21 7.5 12 3"/><polyline points="3 12 12 16.5 21 12"/><polyline points="3 16.5 12 21 21 16.5"/>',kettle:'<path d="M7 9h10l2.5 11h-15z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0"/>',check:'<polyline points="20 6 9 17 4 12"/>',chev:'<polyline points="9 18 15 12 9 6"/>',left:'<polyline points="15 18 9 12 15 6"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.7-1.5-1.5 0-2.6.8-2.6 2s1 1.7 2.8 2c1.8.3 2.8.8 2.8 2s-1.1 2-2.7 2c-1.3 0-2.4-.6-2.9-1.6M12 6.5V8m0 8v1.5"/>',bars:'<rect x="4" y="12" width="4.5" height="8" rx="1.5" fill="currentColor"/><rect x="9.8" y="6" width="4.5" height="14" rx="1.5" fill="currentColor"/><rect x="15.6" y="9" width="4.5" height="11" rx="1.5" fill="currentColor"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',play:'<polygon points="9 6 18 12 9 18" fill="currentColor"/>'};
function ic(n,s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>'}
var TK={strength:"Силовая",diction:"Дикция",trading:"Трейдинг (уроки)",activation:"Активация",mobility:"Мобильность",meditation:"Медитация",book:"Книга",english:"Английский",tactics:"Тактика футбола"};
var PLAN={0:["book","english","tactics"],1:["strength","diction","trading"],2:["activation","mobility","meditation"],3:["strength","diction","trading"],4:["activation","mobility","meditation"],5:["strength","diction","trading"],6:["activation","mobility","meditation","book"]};
var DAYNAME={0:"Книга",1:"Силовая",2:"Активация",3:"Силовая",4:"Активация",5:"Силовая",6:"Активация"};
var AV=[["shorts","Без коротких видео"],["adult","Без взрослого контента"],["self","Без разговоров с собой и эдитов"]];
var MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var DF=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var S={done:{},reset:null,w:80,e:0,eh:[]};
try{var raw=localStorage.getItem("fire1");if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(x){}
function save(){try{localStorage.setItem("fire1",JSON.stringify(S))}catch(x){}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function add(k,n){var d=pd(k);d.setDate(d.getDate()+n);return key(d)}
var now=new Date(),TODAY=key(now),sel=TODAY,tab="home",sheet=false,sa=false,vm=new Date(now.getFullYear(),now.getMonth(),1),armed=false,anim=true;
function rec(k){return S.done[k]||{t:[],a:[]}}
function need(k){return PLAN[pd(k).getDay()]}
function cnt(k){var r=rec(k);return [r.t.filter(function(i){return need(k).indexOf(i)>-1}).length+r.a.length,need(k).length+AV.length]}
function complete(k){var c=cnt(k);return c[0]===c[1]}
function streak(){var k=TODAY,n=0;if(!complete(k))k=add(k,-1);for(var i=0;i<500;i++){if(S.reset&&k<S.reset)break;if(!complete(k))break;n++;k=add(k,-1)}return n}
function best(){var ks=Object.keys(S.done).sort();if(!ks.length)return 0;var k=ks[0],b=0,r=0;while(k<=TODAY){if(complete(k)){r++;if(r>b)b=r}else r=0;k=add(k,1)}return b}
function closed(){var n=0;Object.keys(S.done).forEach(function(k){if(complete(k))n++});return n}
function trainings(){var n=0,y=now.getFullYear(),m=now.getMonth();for(var i=1;i<=now.getDate();i++){if(rec(key(new Date(y,m,i))).t.indexOf("strength")>-1)n++}return n}
function planned(){var n=0,y=now.getFullYear(),m=now.getMonth();for(var i=1;i<=now.getDate();i++){if(need(key(new Date(y,m,i))).indexOf("strength")>-1)n++}return n}
function pct(a,b){return b?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function earnAt(k){var v=0;S.eh.forEach(function(x){if(x[0]<=k)v=x[1]});return v}
function setEarn(v){S.e=v;S.eh=S.eh.filter(function(x){return x[0]!==TODAY});S.eh.push([TODAY,v]);S.eh.sort();S.eh=S.eh.slice(-200)}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00a0")}
function message(){var c=cnt(TODAY),left=c[1]-c[0],h=now.getHours();
if(left===0)return ["ok","День закрыт. Серия "+streak()+". Так и меняется жизнь."];
if(left===1)return ["warn","Осталось совсем чуть-чуть: один пункт, и день твой."];
if(h>=18)return ["warn","Если сейчас не нажмёшь, серия сгорит. Ты начинал это ради себя."];
var q=["Только ты и твоя цель. Всё остальное подождёт до января.","Каждая отметка — шаг к 74 кг и 300 000 ₽.","Дофамин вернётся, когда ты перестанешь кормить его пустым.","Сегодня ты на шаг ближе к версии себя, которой гордишься."];
return ["",q[now.getDate()%q.length]]}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},2200)}
function week(off){var d=pd(TODAY),dow=(d.getDay()+6)%7,mon=add(TODAY,-dow+off*7),out=[];for(var i=0;i<7;i++){var k=add(mon,i);out.push({k:k,n:k<=TODAY?cnt(k)[0]:0})}return out}
function home(){
var c=cnt(TODAY),dow=now.getDay(),pl=need(TODAY),m=message(),s=streak(),h="";
var left=Math.max(0,Math.ceil((new Date(2026,11,31)-pd(TODAY))/864e5));
h+='<div class="card"><div class="lbl">'+DF[dow]+', '+now.getDate()+' '+MG[now.getMonth()]+'</div><div class="big">'+DAYNAME[dow]+'</div><div class="sub">'+pl.map(function(i){return TK[i]}).join(", ")+'</div>'
+'<div class="chips"><div class="chip">'+ic("check",20)+c[0]+' из '+c[1]+'</div><div class="chip">'+ic("clock",20)+'до 31.12: '+left+' дн.</div></div>'
+'<button class="cta" data-a="open" data-k="'+TODAY+'"><span class="pl">'+ic("play",18)+'</span>'+(c[0]===c[1]?'День закрыт':'Задачи дня')+'</button><div class="msg '+m[0]+'">'+m[1]+'</div></div>';
var tr=trainings(),pn=planned();
h+='<div class="tiles"><div class="tile"><span class="bd">рек. '+best()+'</span><div class="ico">'+ic("flame",24)+'</div><div class="n">'+s+'</div><div class="t">дней подряд</div></div>'
+'<div class="tile"><span class="bd">'+pct(tr,pn)+'%</span><div class="ico">'+ic("dumb",24)+'</div><div class="n">'+tr+'</div><div class="t">силовых</div></div>'
+'<div class="tile"><div class="ico">'+ic("layers",24)+'</div><div class="n">'+closed()+'</div><div class="t">дней закрыто</div></div></div>';
var g="",n30=0;
for(var i=29;i>=0;i--){var k=add(TODAY,-i),cc=cnt(k),f=cc[0]===cc[1],cl="p";if(f){cl+=" f";n30++}else if(cc[0]>0&&k<TODAY)cl+=" d";if(k===TODAY)cl+=" t";g+='<button class="'+cl+'" data-a="open" data-k="'+k+'"></button>'}
h+='<div class="card hist" style="padding:20px"><div class="top"><span>Последние 30 дней</span><button data-a="tab" data-k="cal">'+n30+' закрыто '+ic("chev",18)+'</button></div><div class="g30">'+g+'</div></div>';
var pts=[],mx=1;for(var j=7;j>=0;j--){var v=earnAt(add(TODAY,-7*j));pts.push(v);if(v>mx)mx=v}
var P=pts.map(function(v,i){return [i*200/7,70-v/mx*52]}),ln="M"+P.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" L");
var w0=week(0),w1=week(-1),t0=0,t1=0,mxw=7,bars="";
w0.forEach(function(x){t0+=x.n});w1.forEach(function(x){t1+=x.n});
var nm=["П","В","С","Ч","П","С","В"];
w0.forEach(function(x,i){bars+='<div><b style="font-weight:600">'+(x.n||"")+'</b><i class="'+(x.k===TODAY?'on':'')+'" style="height:'+(8+x.n/mxw*58)+'px"></i><span>'+nm[i]+'</span></div>'});
h+='<div class="two"><div class="card"><div class="mh">'+ic("coin",20)+'Доход</div><div class="ms">8 недель</div><div class="val">'+fmt(S.e)+'<small>₽</small></div>'
+'<svg viewBox="0 0 200 80" width="100%" height="80" preserveAspectRatio="none" style="margin-top:12px"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a8e"/><stop offset="1" stop-color="#2a2a2e"/></linearGradient></defs><path d="'+ln+' L200 80 L0 80Z" fill="url(#gr)"/><path d="'+ln+'" fill="none" stroke="#c7c7cc" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>'
+'<div class="card"><div class="mh">'+ic("dumb",20)+'Неделя</div><div class="ms">пунктов в день</div><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="val">'+t0+'<small>пт.</small></div>'+(t1>0?'<b style="color:var(--green);font-size:13px">'+(t0>=t1?'+':'')+Math.round((t0-t1)/t1*100)+'%</b>':'')+'</div><div class="wk">'+bars+'</div></div></div>';
h+='<div class="card"><div class="bw"><div><div class="mh">'+ic("kettle",20)+'Вес</div><div class="val" style="margin-top:10px">'+S.w.toFixed(1)+'<small>кг</small></div><div class="sm">Цель 74 кг · осталось '+Math.max(0,S.w-74).toFixed(1)+' кг</div></div><div class="step"><button data-a="wm">−</button><button data-a="wp">+</button></div></div><div class="bar"><i style="width:'+pct(80-S.w,6)+'%"></i></div></div>';
return h}
function calendar(){
var y=vm.getFullYear(),m=vm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),dd=0,h="",cells="";
for(var i=0;i<first;i++)cells+='<div class="cc e"></div>';
for(var i=1;i<=dim;i++){var k=key(new Date(y,m,i)),cc=cnt(k),f=cc[0]===cc[1],cl="cc";if(f){cl+=" f";dd++}else if(cc[0]>0&&k<TODAY)cl+=" d";else if(k>TODAY)cl+=" x";if(k===TODAY)cl+=" t";cells+='<button class="'+cl+'" data-a="open" data-k="'+k+'">'+i+'</button>'}
h+='<div class="hd"><div class="h1">Календарь</div><div class="h2">Нажми на день, чтобы увидеть задачи</div></div>';
h+='<div class="card"><div class="nav"><button data-a="pm">'+ic("left",20)+'</button><b>'+MN[m]+' '+y+'</b><button data-a="nm">'+ic("chev",20)+'</button></div><div class="dn">';
["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function(n){h+='<div>'+n+'</div>'});
h+='</div><div class="cg">'+cells+'</div></div>';
h+='<div class="card" style="padding:18px 22px"><div class="mh">'+ic("check",20)+'Закрыто в месяце</div><div class="val" style="margin-top:10px">'+dd+'<small>из '+dim+' дней</small></div><div class="bar"><i style="width:'+pct(dd,dim)+'%"></i></div></div>';
return h}
function goals(){
var left=Math.max(0,Math.ceil((new Date(2026,11,31)-pd(TODAY))/864e5));
return '<div class="hd"><div class="h1">Цели</div><div class="h2">Всё до конца года</div></div>'
+'<div class="card"><div class="bw"><div><div class="mh">'+ic("kettle",20)+'Вес</div><div class="sm" style="margin-top:6px">цель 74 кг</div></div><div class="fi"><input type="number" inputmode="decimal" step="0.1" value="'+S.w+'" data-a="w"><span>кг</span></div></div><div class="bar"><i style="width:'+pct(80-S.w,6)+'%"></i></div></div>'
+'<div class="card"><div class="bw"><div><div class="mh">'+ic("coin",20)+'Заработано</div><div class="sm" style="margin-top:6px">цель 300 000 ₽</div></div><div class="fi"><input type="number" inputmode="numeric" value="'+S.e+'" data-a="e"><span>₽</span></div></div><div class="bar"><i style="width:'+pct(S.e,300000)+'%"></i></div></div>'
+'<div class="two"><div class="card"><div class="mh">'+ic("clock",20)+'Осталось</div><div class="val" style="margin-top:12px">'+left+'<small>дн.</small></div></div><div class="card"><div class="mh">'+ic("flame",20)+'Рекорд</div><div class="val" style="margin-top:12px">'+best()+'<small>дн.</small></div></div></div>'
+'<button class="rst'+(armed?' arm':'')+'" data-a="reset">'+(armed?'Точно сбросить серию?':'Сбросить серию')+'</button>'}
function sheetHtml(){
var d=pd(sel),r=rec(sel),c=cnt(sel),lock=sel>TODAY,h='<div class="ov" data-a="close"></div><div class="sh'+(sa?' in':'')+'"><div class="grab"></div>';
h+='<h3>'+(sel===TODAY?'Сегодня':d.getDate()+' '+MG[d.getMonth()])+'</h3><div class="s2">'+DF[d.getDay()]+' · выполнено '+c[0]+' из '+c[1]+(lock?' · день ещё впереди':'')+'</div>';
need(sel).forEach(function(i){var on=r.t.indexOf(i)>-1;h+='<button class="task'+(on?' on':'')+(lock?' lock':'')+'" data-a="t" data-i="'+i+'"><span class="bx">'+(on?ic("check",16):'')+'</span><span class="n">'+TK[i]+'</span></button>'});
h+='<div class="sec">Чего не делаю</div>';
AV.forEach(function(a){var on=r.a.indexOf(a[0])>-1;h+='<button class="task'+(on?' on':'')+(lock?' lock':'')+'" data-a="a" data-i="'+a[0]+'"><span class="bx">'+(on?ic("check",16):'')+'</span><span class="n">'+a[1]+'</span></button>'});
return h+'<button class="cta" data-a="close" style="margin-top:12px;height:58px">Готово</button></div>'}
function draw(){
var f={home:home,cal:calendar,goals:goals},a=document.getElementById("app");
a.className="app"+(anim?" fade":"");a.innerHTML=f[tab]();anim=false;
var T=[["home","bars"],["cal","cal"],["goals","target"]],t="";
T.forEach(function(x){t+='<button data-a="tab" data-k="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+ic(x[1],26)+'</button>'});
document.getElementById("tabs").innerHTML=t;
document.getElementById("sheet").innerHTML=sheet?sheetHtml():"";sa=false}
function onClick(ev){var b=ev.target.closest("[data-a]");if(!b||b.tagName==="INPUT")return;var a=b.dataset.a;try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
if(a==="t"||a==="a"){var was=complete(sel),r=S.done[sel]||(S.done[sel]={t:[],a:[]}),arr=a==="t"?r.t:r.a,i=arr.indexOf(b.dataset.i);if(i>-1)arr.splice(i,1);else arr.push(b.dataset.i);save();if(!was&&complete(sel))toast("День закрыт. Серия "+streak())}
else if(a==="open"){sel=b.dataset.k;sheet=true;sa=true}
else if(a==="close"){sheet=false}
else if(a==="tab"){tab=b.dataset.k;sheet=false;anim=true;window.scrollTo(0,0)}
else if(a==="pm"){vm=new Date(vm.getFullYear(),vm.getMonth()-1,1)}
else if(a==="nm"){vm=new Date(vm.getFullYear(),vm.getMonth()+1,1)}
else if(a==="wm"){S.w=Math.round((S.w-0.1)*10)/10;save()}
else if(a==="wp"){S.w=Math.round((S.w+0.1)*10)/10;save()}
else if(a==="reset"){if(!armed){armed=true;setTimeout(function(){armed=false;draw()},3000)}else{armed=false;S.reset=TODAY;save();toast("Серия сброшена. Начинаем заново")}}
draw()}
["app","sheet","tabs"].forEach(function(id){document.getElementById(id).addEventListener("click",onClick)});
document.getElementById("app").addEventListener("change",function(ev){var t=ev.target;if(t.dataset.a==="w"){S.w=parseFloat(t.value)||0}if(t.dataset.a==="e"){setEarn(parseInt(t.value,10)||0)}save();draw()});
draw();
</script>
</body>
</html>
